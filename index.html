<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>???</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#14100c;
    --bg-alt:#0f0c09;
    --surface:#1e1712;
    --surface-2:#271e17;
    --line:#392c22;
    --text:#f5efe6;
    --text-muted:#a9998a;
    --accent:#e3a23b;
    --accent-dim:#8a6a2e;
    --danger:#d9614f;
    --good:#6fa968;
    --info:#5f9ad9;
    --radius:10px;
    font-size:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Manrope',sans-serif;
    min-height:100vh;
  }
  ::selection{background:var(--accent);color:#1a1208;}
  .mono{font-family:'JetBrains Mono',monospace;}

  /* ───── DISFARCE / LOGIN (o que aparece ANTES de logar) ───── */
  #tela-login{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    position:relative;
    overflow:hidden;
    background:radial-gradient(ellipse at center, #0a0a0a 0%, #000 75%);
  }
  #tela-login::after{
    /* leve textura de scanline, dá um ar de terminal/tela antiga */
    content:"";
    position:absolute;
    inset:0;
    background:repeating-linear-gradient(
      0deg,
      rgba(255,255,255,.025) 0px,
      rgba(255,255,255,.025) 1px,
      transparent 1px,
      transparent 3px
    );
    pointer-events:none;
    z-index:2;
    mix-blend-mode:overlay;
  }
  #camada-interrogacoes{
    position:absolute;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:0;
  }
  #camada-interrogacoes span{
    position:absolute;
    font-family:'JetBrains Mono',monospace;
    font-weight:700;
    color:#2e2e2e;
    user-select:none;
    animation-name:piscar-interrogacao;
    animation-timing-function:ease-in-out;
    animation-iteration-count:infinite;
  }
  @keyframes piscar-interrogacao{
    0%, 100%{ opacity:var(--op-min); }
    50%{ opacity:var(--op-max); }
  }
  #palavra-secreta{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    font-family:'JetBrains Mono',monospace;
    font-size:min(14vw, 7rem);
    font-weight:700;
    letter-spacing:.15em;
    color:#1c1c1c;
    text-shadow:0 0 40px rgba(60,60,60,.25);
    z-index:0;
    pointer-events:none;
    white-space:nowrap;
    animation:tremeluzir-secreto 7s ease-in-out infinite;
  }
  @keyframes tremeluzir-secreto{
    0%, 15%, 17%, 60%, 62%, 100%{ opacity:1; text-shadow:0 0 40px rgba(60,60,60,.25); }
    16%, 61%{ opacity:.3; text-shadow:none; }
    85%{ opacity:.75; }
  }
  .cartao-login{
    position:relative;
    z-index:3;
    width:100%;
    max-width:340px;
    background:rgba(8,8,8,.9);
    backdrop-filter:blur(8px);
    border:1px solid #262626;
    border-radius:var(--radius);
    padding:30px 26px;
    box-shadow:0 0 0 1px rgba(255,255,255,.02), 0 20px 60px rgba(0,0,0,.6);
    animation:aparecer-cartao 1.1s ease-out;
  }
  @keyframes aparecer-cartao{
    from{ opacity:0; transform:translateY(10px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .cartao-login .marca{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin-bottom:20px;
  }
  .marca .ponto{
    width:6px;height:6px;border-radius:50%;
    background:#3a3a3a;
    animation:pulsar-ponto 2.4s ease-in-out infinite;
  }
  @keyframes pulsar-ponto{
    0%,100%{ background:#3a3a3a; }
    50%{ background:#6a6a6a; }
  }
  .marca span{
    font-family:'JetBrains Mono',monospace;
    letter-spacing:.3em;
    color:#4a4a4a;
    font-size:.7rem;
  }
  .cartao-login h1{
    display:none;
  }
  .cartao-login p.sub{
    display:none;
  }
  label{
    display:block;
    font-size:.78rem;
    color:var(--text-muted);
    margin:0 0 6px;
    font-weight:500;
  }
  input[type=email], input[type=password], input[type=text], input[type=date]{
    width:100%;
    background:var(--bg-alt);
    border:1px solid var(--line);
    color:var(--text);
    padding:11px 13px;
    border-radius:8px;
    font-size:.92rem;
    font-family:inherit;
    margin-bottom:16px;
    outline:none;
    transition:border-color .15s;
  }
  input:focus{border-color:var(--accent);}
  button{
    font-family:'Manrope',sans-serif;
    font-weight:700;
    font-size:.9rem;
    border:none;
    border-radius:8px;
    padding:11px 16px;
    cursor:pointer;
    transition:filter .15s, transform .1s;
  }
  button:active{transform:scale(.98);}
  .botao-principal{
    width:100%;
    background:var(--accent);
    color:#1a1208;
  }
  .botao-principal:hover{filter:brightness(1.08);}
  .erro-login{
    color:var(--danger);
    font-size:.82rem;
    margin-top:12px;
    display:none;
  }

  /* ───── PAINEL ───── */
  #tela-painel{display:none;}
  header.topo{
    border-bottom:1px solid var(--line);
    background:var(--bg-alt);
    padding:16px 28px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
    position:sticky;
    top:0;
    z-index:10;
  }
  header.topo .marca{display:flex;align-items:center;gap:10px;}
  header.topo h1{font-size:1.05rem;margin:0;font-weight:800;}
  .indicador-live{
    display:flex;align-items:center;gap:7px;
    font-family:'JetBrains Mono',monospace;
    font-size:.72rem;
    color:var(--text-muted);
  }
  .indicador-live .bola{
    width:7px;height:7px;border-radius:50%;
    background:#8a8a8a;
    animation:pulsar 1.2s infinite;
  }
  .indicador-live .bola.ok{
    background:var(--good);
    animation:pulsar 2s infinite;
  }
  .indicador-live .bola.erro{
    background:var(--danger);
    animation:none;
  }
  @keyframes pulsar{
    0%,100%{opacity:1;}
    50%{opacity:.35;}
  }
  .botao-sair{
    background:transparent;
    border:1px solid var(--line);
    color:var(--text-muted);
  }
  .botao-sair:hover{border-color:var(--danger);color:var(--danger);}

  main{
    max-width:1080px;
    margin:0 auto;
    padding:24px 28px 80px;
  }

  .abas{
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding-bottom:4px;
    margin-bottom:18px;
    border-bottom:1px solid var(--line);
  }
  .aba{
    background:transparent;
    color:var(--text-muted);
    padding:9px 14px;
    font-size:.85rem;
    border-radius:8px 8px 0 0;
    white-space:nowrap;
  }
  .aba.ativa{
    color:var(--accent);
    background:var(--surface);
    box-shadow:inset 0 -2px 0 var(--accent);
  }

  .filtros{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:20px;
    align-items:flex-end;
  }
  .filtros .campo{flex:1;min-width:160px;margin-bottom:0;}
  .filtros label{margin-bottom:6px;}
  .filtros input{margin-bottom:0;}
  #busca{flex:2;min-width:220px;}
  .botao-secundario{
    background:var(--surface-2);
    color:var(--text);
    border:1px solid var(--line);
    white-space:nowrap;
  }
  .botao-secundario:hover{border-color:var(--accent);}

  #lista-logs{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .linha-log{
    background:var(--surface);
    border:1px solid var(--line);
    border-left:3px solid var(--categoria-cor, var(--accent-dim));
    border-radius:8px;
    padding:12px 14px;
    display:flex;
    gap:14px;
    align-items:flex-start;
  }
  .linha-log .horario{
    font-family:'JetBrains Mono',monospace;
    font-size:.76rem;
    color:var(--text-muted);
    white-space:nowrap;
    padding-top:2px;
    min-width:118px;
  }
  .linha-log .conteudo{flex:1;min-width:0;}
  .linha-log .descricao{font-size:.9rem;line-height:1.45;word-break:break-word;}
  .linha-log .tags{
    display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;
  }
  .etiqueta{
    font-family:'JetBrains Mono',monospace;
    font-size:.68rem;
    padding:2px 7px;
    border-radius:5px;
    background:var(--surface-2);
    color:var(--text-muted);
  }
  .linha-log .detalhes{
    margin-top:8px;
    font-family:'JetBrains Mono',monospace;
    font-size:.76rem;
    color:var(--text-muted);
    background:var(--bg-alt);
    border-radius:6px;
    padding:8px 10px;
    white-space:pre-wrap;
    word-break:break-word;
    display:none;
  }
  .linha-log .ver-mais{
    background:none;border:none;color:var(--info);
    font-size:.74rem;padding:0;margin-top:6px;
    text-decoration:underline;cursor:pointer;
  }

  .estado-vazio, .estado-carregando{
    text-align:center;
    color:var(--text-muted);
    padding:50px 20px;
    font-size:.9rem;
  }

  /* ───── RELATÓRIO DE CALLS ───── */
  .cartao-call{
    background:var(--surface);
    border:1px solid var(--line);
    border-left:3px solid var(--accent);
    border-radius:8px;
    padding:14px 16px;
    margin-bottom:8px;
    cursor:pointer;
  }
  .cartao-call .cabecalho-call{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
  }
  .cartao-call .canal-nome{font-weight:700;font-size:.95rem;}
  .cartao-call .data-call{
    font-family:'JetBrains Mono',monospace;
    font-size:.74rem;
    color:var(--text-muted);
  }
  .resumo-call{
    display:flex;
    gap:18px;
    margin-top:8px;
    flex-wrap:wrap;
    font-size:.82rem;
    color:var(--text-muted);
  }
  .resumo-call b{color:var(--text);}
  .resumo-call .recorde{color:var(--accent);}
  .lista-participantes{
    margin-top:12px;
    padding-top:12px;
    border-top:1px solid var(--line);
    display:none;
  }
  .participante-linha{
    display:flex;
    justify-content:space-between;
    padding:5px 0;
    font-size:.85rem;
  }
  .participante-linha .barra-fundo{
    flex:1;
    height:5px;
    background:var(--surface-2);
    border-radius:3px;
    margin:0 12px;
    align-self:center;
    overflow:hidden;
  }
  .participante-linha .barra{
    height:100%;
    background:var(--accent);
    border-radius:3px;
  }
  .participante-linha .tempo{
    font-family:'JetBrains Mono',monospace;
    font-size:.76rem;
    color:var(--text-muted);
    white-space:nowrap;
  }

  #carregar-mais{
    display:block;
    margin:22px auto 0;
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--text);
  }
  #carregar-mais:hover{border-color:var(--accent);}

  @media(max-width:600px){
    :root{ font-size:15px; }
    main{padding:16px 12px 60px;}
    header.topo{padding:12px 14px;gap:10px;}
    header.topo h1{font-size:.92rem;}
    .indicador-live span:not(.bola){display:none;}
    .linha-log{flex-direction:column;gap:4px;padding:11px 12px;}
    .linha-log .horario{min-width:auto;font-size:.7rem;}
    .filtros{flex-direction:column;align-items:stretch;}
    .filtros .campo{min-width:0;width:100%;}
    #busca{min-width:0;}
    .abas{gap:4px;}
    .aba{padding:9px 12px;font-size:.8rem;flex:0 0 auto;}
    .cartao-login{max-width:100%;padding:26px 20px;}
    .resumo-call{gap:10px 16px;font-size:.78rem;}
    .cabecalho-call{gap:6px;}
    button{min-height:42px;}
    input[type=email], input[type=password], input[type=text], input[type=date]{
      font-size:1rem; /* evita zoom automático no iOS ao focar o campo */
    }
  }
</style>
</head>
<body>

<!-- ═══════════════ TELA DE DISFARCE / LOGIN ═══════════════ -->
<div id="tela-login">
  <div id="camada-interrogacoes"></div>
  <div id="palavra-secreta">SECRET</div>
  <div class="cartao-login">
    <div class="marca"><span class="ponto"></span><span>• • •</span></div>
    <form id="form-login">
      <label for="campo-email">E-mail</label>
      <input type="email" id="campo-email" required autocomplete="username" />
      <label for="campo-senha">Senha</label>
      <input type="password" id="campo-senha" required autocomplete="current-password" />
      <button type="submit" class="botao-principal">Entrar</button>
      <p class="erro-login" id="erro-login"></p>
    </form>
  </div>
</div>

<!-- ═══════════════ PAINEL ═══════════════ -->
<div id="tela-painel">
  <header class="topo">
    <div class="marca">
      <span class="ponto"></span>
      <h1>FrangoBot — Painel de Logs</h1>
    </div>
    <div style="display:flex;align-items:center;gap:16px;">
      <div class="indicador-live" id="indicador-live" title="Verificando conexão em tempo real..."><span class="bola" id="bola-status"></span> <span id="texto-status">conectando...</span></div>
      <button class="botao-sair" id="botao-sair">Sair</button>
    </div>
  </header>

  <main>
    <div class="abas" id="abas">
      <button class="aba ativa" data-categoria="">Tudo</button>
      <button class="aba" data-categoria="membros">Membros</button>
      <button class="aba" data-categoria="mensagens">Mensagens</button>
      <button class="aba" data-categoria="voz">Voz</button>
      <button class="aba" data-categoria="comandos">Comandos</button>
      <button class="aba" data-categoria="moderacao_auto">Moderação Automática</button>
      <button class="aba" data-categoria="__relatorio__">📊 Relatório de Calls</button>
    </div>

    <div class="filtros">
      <div class="campo">
        <label for="busca">Buscar (nome, texto do log...)</label>
        <input type="text" id="busca" placeholder="ex: joão, mensagem apagada, #geral..." />
      </div>
      <div class="campo">
        <label for="data-inicio">De</label>
        <input type="date" id="data-inicio" />
      </div>
      <div class="campo">
        <label for="data-fim">Até</label>
        <input type="date" id="data-fim" />
      </div>
      <button class="botao-secundario" id="botao-limpar-filtros">Limpar filtros</button>
    </div>

    <div id="lista-logs"></div>
    <div id="lista-relatorio" style="display:none;"></div>
    <button id="carregar-mais" style="display:none;">Carregar mais antigos</button>
  </main>
</div>

<script>
// ══════════════════════════════════════════════════════════════
// CONFIGURE AQUI: URL e ANON KEY do seu projeto Supabase.
// A anon key é pública por design (protegida pela política de RLS
// que exige login) — pode ficar exposta no HTML sem problema.
// ══════════════════════════════════════════════════════════════
const SUPABASE_URL = "https://uygrychfufqlrvsjejfx.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_UFqAV1ttoqUqclo3Y243yQ_ATAipOPv";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: {
    persistSession: true,     // mantém o login salvo no navegador (localStorage)
    autoRefreshToken: true,   // renova a sessão sozinho, sem precisar logar de novo toda hora
  },
});

const PAGINA_TAMANHO = 40;
let categoriaAtual = "";
let paginaAtual = 0;
let fimDaLista = false;

const CORES_CATEGORIA = {
  membros: "#6fa968",
  mensagens: "#5f9ad9",
  voz: "#e3a23b",
  comandos: "#a9998a",
  moderacao_auto: "#d9614f",
  servidor: "#9a7fd0",
};

const NOMES_CATEGORIA = {
  membros: "Membros",
  mensagens: "Mensagens",
  voz: "Voz",
  comandos: "Comandos",
  moderacao_auto: "Moderação Automática",
  servidor: "Servidor",
};

// ───── DISFARCE: "?" espalhados pela tela de login ─────
function gerarInterrogacoes() {
  const camada = document.getElementById("camada-interrogacoes");
  if (!camada || camada.childElementCount > 0) return;
  const qtd = window.innerWidth < 600 ? 26 : 46;
  for (let i = 0; i < qtd; i++) {
    const span = document.createElement("span");
    span.textContent = "?";
    const opMin = (0.05 + Math.random() * 0.10).toFixed(2);
    const opMax = (opMin * 1 + 0.15 + Math.random() * 0.15).toFixed(2);
    span.style.top = `${Math.random() * 100}%`;
    span.style.left = `${Math.random() * 100}%`;
    span.style.fontSize = `${0.8 + Math.random() * 2.6}rem`;
    span.style.transform = `rotate(${Math.round(Math.random() * 60 - 30)}deg)`;
    span.style.setProperty("--op-min", opMin);
    span.style.setProperty("--op-max", opMax);
    span.style.animationDuration = `${3 + Math.random() * 5}s`;
    span.style.animationDelay = `-${Math.random() * 5}s`;
    camada.appendChild(span);
  }
}
gerarInterrogacoes();

// ───── LOGIN / SESSÃO ─────
const telaLogin = document.getElementById("tela-login");
const telaPainel = document.getElementById("tela-painel");

async function checarSessao() {
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    sb.realtime.setAuth(session.access_token);   // sem isso, o tempo real fica bloqueado pela RLS
    mostrarPainel();
  } else {
    telaLogin.style.display = "flex";
    telaPainel.style.display = "none";
  }
}

// mantém o realtime autorizado mesmo quando o token é renovado sozinho
sb.auth.onAuthStateChange((_event, session) => {
  if (session) sb.realtime.setAuth(session.access_token);
});

document.getElementById("form-login").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = document.getElementById("campo-email").value.trim();
  const senha = document.getElementById("campo-senha").value;
  const erroEl = document.getElementById("erro-login");
  erroEl.style.display = "none";

  const { data, error } = await sb.auth.signInWithPassword({ email, password: senha });
  if (error) {
    erroEl.textContent = "E-mail ou senha inválidos.";
    erroEl.style.display = "block";
    return;
  }
  sb.realtime.setAuth(data.session.access_token);
  mostrarPainel();
});

document.getElementById("botao-sair").addEventListener("click", async () => {
  await sb.auth.signOut();
  location.reload();
});

function mostrarPainel() {
  document.title = "FrangoBot — Painel de Logs";
  telaLogin.style.display = "none";
  telaPainel.style.display = "block";
  resetarEBuscar();
  iniciarRealtime();
}

// ───── ABAS ─────
let modoRelatorio = false;

document.getElementById("abas").addEventListener("click", (e) => {
  const btn = e.target.closest(".aba");
  if (!btn) return;
  document.querySelectorAll(".aba").forEach(a => a.classList.remove("ativa"));
  btn.classList.add("ativa");
  modoRelatorio = btn.dataset.categoria === "__relatorio__";
  categoriaAtual = modoRelatorio ? "" : btn.dataset.categoria;

  document.getElementById("lista-logs").style.display = modoRelatorio ? "none" : "flex";
  document.getElementById("lista-relatorio").style.display = modoRelatorio ? "block" : "none";
  document.getElementById("carregar-mais").style.display = "none";

  resetarEBuscar();
});

// ───── FILTROS ─────
let debounceBusca;
document.getElementById("busca").addEventListener("input", () => {
  clearTimeout(debounceBusca);
  debounceBusca = setTimeout(resetarEBuscar, 350);
});
document.getElementById("data-inicio").addEventListener("change", resetarEBuscar);
document.getElementById("data-fim").addEventListener("change", resetarEBuscar);
document.getElementById("botao-limpar-filtros").addEventListener("click", () => {
  document.getElementById("busca").value = "";
  document.getElementById("data-inicio").value = "";
  document.getElementById("data-fim").value = "";
  resetarEBuscar();
});
document.getElementById("carregar-mais").addEventListener("click", () => buscarLogs(false));

function resetarEBuscar() {
  paginaAtual = 0;
  fimDaLista = false;
  if (modoRelatorio) {
    buscarRelatorio();
  } else {
    document.getElementById("lista-logs").innerHTML = "";
    buscarLogs(true);
  }
}

// ───── RELATÓRIO DE CALLS (planilha de duração + participantes) ─────
function formatarDuracao(seg) {
  seg = Math.round(seg);
  const h = Math.floor(seg / 3600);
  const m = Math.floor((seg % 3600) / 60);
  const s = seg % 60;
  return h > 0 ? `${h}h ${m}m ${s}s` : `${m}m ${s}s`;
}

async function buscarRelatorio() {
  const container = document.getElementById("lista-relatorio");
  container.innerHTML = '<div class="estado-carregando">Carregando...</div>';

  const busca = document.getElementById("busca").value.trim();
  const dataInicio = document.getElementById("data-inicio").value;
  const dataFim = document.getElementById("data-fim").value;

  let query = sb.from("logs").select("*")
    .eq("tipo", "chamada_encerrada")
    .order("criado_em", { ascending: false })
    .limit(100);

  if (busca) query = query.ilike("canal_nome", `%${busca}%`);
  if (dataInicio) query = query.gte("criado_em", `${dataInicio}T00:00:00`);
  if (dataFim) query = query.lte("criado_em", `${dataFim}T23:59:59`);

  const { data, error } = await query;

  if (error) {
    container.innerHTML = `<div class="estado-vazio">Erro ao buscar relatório: ${error.message}</div>`;
    return;
  }
  if (!data || data.length === 0) {
    container.innerHTML = '<div class="estado-vazio">Nenhuma call encerrada encontrada com esse filtro.</div>';
    return;
  }

  container.innerHTML = "";
  data.forEach(log => container.appendChild(criarCartaoCall(log)));
}

function criarCartaoCall(log) {
  const d = log.detalhes || {};
  const participantes = d.participantes || [];
  const recorde = d.recorde;
  const maiorTempo = participantes.length ? participantes[0].tempo_segundos : 1;

  const data = new Date(log.criado_em).toLocaleString("pt-BR", {
    day: "2-digit", month: "2-digit", year: "2-digit", hour: "2-digit", minute: "2-digit"
  });

  const cartao = document.createElement("div");
  cartao.className = "cartao-call";
  cartao.innerHTML = `
    <div class="cabecalho-call">
      <span class="canal-nome">#${escaparHtml(log.canal_nome || "?")}</span>
      <span class="data-call mono">${data}</span>
    </div>
    <div class="resumo-call">
      <span>Duração: <b>${escaparHtml(d.duracao_formatada || formatarDuracao(d.duracao_segundos || 0))}</b></span>
      <span>Participantes: <b>${participantes.length}</b></span>
      ${recorde ? `<span class="recorde">👑 ${escaparHtml(recorde.nome)} ficou mais tempo (${formatarDuracao(recorde.tempo_segundos)})</span>` : ""}
    </div>
    <div class="lista-participantes">
      ${participantes.map(p => `
        <div class="participante-linha">
          <span>${escaparHtml(p.nome)}</span>
          <span class="barra-fundo"><span class="barra" style="width:${Math.round((p.tempo_segundos / maiorTempo) * 100)}%"></span></span>
          <span class="tempo mono">${formatarDuracao(p.tempo_segundos)}</span>
        </div>
      `).join("")}
    </div>
  `;

  cartao.addEventListener("click", () => {
    const painel = cartao.querySelector(".lista-participantes");
    painel.style.display = painel.style.display === "block" ? "none" : "block";
  });

  return cartao;
}

async function buscarLogs(primeiraPagina) {
  const lista = document.getElementById("lista-logs");
  const botaoMais = document.getElementById("carregar-mais");

  if (primeiraPagina) {
    lista.innerHTML = '<div class="estado-carregando">Carregando...</div>';
  }

  const busca = document.getElementById("busca").value.trim();
  const dataInicio = document.getElementById("data-inicio").value;
  const dataFim = document.getElementById("data-fim").value;

  let query = sb.from("logs").select("*").order("criado_em", { ascending: false });

  if (categoriaAtual) query = query.eq("categoria", categoriaAtual);
  if (busca) query = query.or(`descricao.ilike.%${busca}%,usuario_nome.ilike.%${busca}%,canal_nome.ilike.%${busca}%`);
  if (dataInicio) query = query.gte("criado_em", `${dataInicio}T00:00:00`);
  if (dataFim) query = query.lte("criado_em", `${dataFim}T23:59:59`);

  const de = paginaAtual * PAGINA_TAMANHO;
  const ate = de + PAGINA_TAMANHO - 1;
  query = query.range(de, ate);

  const { data, error } = await query;

  if (primeiraPagina) lista.innerHTML = "";

  if (error) {
    lista.innerHTML = `<div class="estado-vazio">Erro ao buscar logs: ${error.message}</div>`;
    return;
  }

  if (primeiraPagina && (!data || data.length === 0)) {
    lista.innerHTML = '<div class="estado-vazio">Nenhum log encontrado com esse filtro.</div>';
    botaoMais.style.display = "none";
    return;
  }

  data.forEach(log => lista.appendChild(criarLinhaLog(log)));

  paginaAtual++;
  fimDaLista = data.length < PAGINA_TAMANHO;
  botaoMais.style.display = fimDaLista ? "none" : "block";
}

// ───── Formatação legível dos "detalhes" (em vez de mostrar o JSON cru) ─────
const ROTULOS_DETALHES = {
  conteudo: "Conteúdo",
  antes: "Antes",
  depois: "Depois",
  comando: "Comando",
  opcoes: "Opções",
  cargos: "Cargos",
  adicionados: "Cargos adicionados",
  removidos: "Cargos removidos",
  configurado_por: "Configurado por",
  removido_por: "Removido por",
  usuario_id: "ID do usuário",
  canal_anterior: "Canal anterior",
  canal_novo: "Canal novo",
  conta_criada_em: "Conta criada em",
  canal_id: "ID do canal",
  duracao_segundos: "Duração",
  duracao_formatada: "Duração",
  participantes: "Participantes",
  recorde: "Ficou mais tempo",
};

function formatarValorDetalhe(valor) {
  if (valor === null || valor === undefined || valor === "") return null;
  if (Array.isArray(valor)) {
    if (valor.length === 0) return null;
    return valor.map(v => formatarValorDetalhe(v)).join(", ");
  }
  if (typeof valor === "object") {
    if ("nome" in valor && "tempo_segundos" in valor) {
      return `${valor.nome} (${formatarDuracao(valor.tempo_segundos)})`;
    }
    const partes = Object.entries(valor).map(([k, v]) => formatarValorDetalhe(v)).filter(Boolean);
    return partes.length ? partes.join(", ") : null;
  }
  if (typeof valor === "boolean") return valor ? "sim" : "não";
  return String(valor);
}

function formatarDetalhes(detalhes) {
  const linhas = [];
  for (const [chave, valor] of Object.entries(detalhes || {})) {
    if (chave === "duracao_segundos" && detalhes.duracao_formatada) continue; // evita duplicar duração
    const texto = formatarValorDetalhe(valor);
    if (!texto) continue;
    const rotulo = ROTULOS_DETALHES[chave] || chave.replace(/_/g, " ").replace(/^\w/, c => c.toUpperCase());
    linhas.push(`${rotulo}: ${texto}`);
  }
  return linhas.length ? linhas.join("\n") : null;
}

function criarLinhaLog(log) {
  const div = document.createElement("div");
  div.className = "linha-log";
  div.style.setProperty("--categoria-cor", CORES_CATEGORIA[log.categoria] || "#8a6a2e");

  const horario = new Date(log.criado_em).toLocaleString("pt-BR", {
    day: "2-digit", month: "2-digit", year: "2-digit",
    hour: "2-digit", minute: "2-digit", second: "2-digit"
  });

  const textoDetalhes = formatarDetalhes(log.detalhes);

  div.innerHTML = `
    <div class="horario mono">${horario}</div>
    <div class="conteudo">
      <div class="descricao">${escaparHtml(log.descricao)}</div>
      <div class="tags">
        <span class="etiqueta">${NOMES_CATEGORIA[log.categoria] || log.categoria}</span>
        <span class="etiqueta">${escaparHtml(log.tipo)}</span>
        ${log.canal_nome ? `<span class="etiqueta">#${escaparHtml(log.canal_nome)}</span>` : ""}
      </div>
      ${textoDetalhes ? `<button class="ver-mais">ver detalhes</button><div class="detalhes mono">${escaparHtml(textoDetalhes)}</div>` : ""}
    </div>
  `;

  if (textoDetalhes) {
    const botao = div.querySelector(".ver-mais");
    const painelDetalhes = div.querySelector(".detalhes");
    botao.addEventListener("click", () => {
      const aberto = painelDetalhes.style.display === "block";
      painelDetalhes.style.display = aberto ? "none" : "block";
      botao.textContent = aberto ? "ver detalhes" : "esconder detalhes";
    });
  }

  return div;
}

function escaparHtml(txt) {
  const div = document.createElement("div");
  div.textContent = String(txt);
  return div.innerHTML;
}

// ───── LOGS EM TEMPO REAL (novo evento aparece na hora, sem recarregar) ─────
function iniciarRealtime() {
  sb.channel("logs-tempo-real")
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "logs" }, (payload) => {
      if (modoRelatorio) {
        if (payload.new.tipo === "chamada_encerrada") {
          const semFiltro = !document.getElementById("busca").value &&
                             !document.getElementById("data-inicio").value &&
                             !document.getElementById("data-fim").value;
          if (semFiltro) {
            const container = document.getElementById("lista-relatorio");
            if (container.querySelector(".estado-vazio")) container.innerHTML = "";
            container.insertBefore(criarCartaoCall(payload.new), container.firstChild);
          }
        }
        return;
      }
      // só injeta na hora se estiver na aba "Tudo" (ou na aba certa) e sem filtro de busca/data ativo,
      // pra não bagunçar uma busca que a pessoa esteja fazendo
      const semFiltro = !document.getElementById("busca").value &&
                         !document.getElementById("data-inicio").value &&
                         !document.getElementById("data-fim").value;
      const bateComAba = !categoriaAtual || categoriaAtual === payload.new.categoria;
      if (semFiltro && bateComAba) {
        const lista = document.getElementById("lista-logs");
        if (lista.querySelector(".estado-vazio")) lista.innerHTML = "";
        lista.insertBefore(criarLinhaLog(payload.new), lista.firstChild);
      }
    })
    .subscribe((status, err) => {
      // Reflete o status real da conexão no indicador do topo, além do console —
      // assim dá pra ver o problema sem precisar abrir o DevTools.
      const bola = document.getElementById("bola-status");
      const texto = document.getElementById("texto-status");
      const wrapper = document.getElementById("indicador-live");
      console.log("[tempo real] status:", status, err || "");

      if (status === "SUBSCRIBED") {
        bola.className = "bola ok";
        texto.textContent = "ao vivo";
        wrapper.title = "Conectado — logs novos aparecem sozinhos, sem precisar recarregar.";
      } else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT" || status === "CLOSED") {
        bola.className = "bola erro";
        texto.textContent = "sem tempo real (F5)";
        wrapper.title = "Falta rodar no SQL Editor do Supabase:\nalter publication supabase_realtime add table public.logs;\n(está no fim do supabase/schema.sql)";
      } else {
        bola.className = "bola";
        texto.textContent = "conectando...";
      }
    });
}
